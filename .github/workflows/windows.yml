# Bei jedem Tag (v…) unter Windows bauen und AniQu-windows.zip an den Release hängen.
# Gebaut wird in MSYS2 (UCRT64), dort gibt es GTK4 und libmpv fertig; die nötigen DLLs und Daten kommen mit ins ZIP.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # zum Ausprobieren von Hand starten (Actions → Windows → Run workflow), ohne Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      # quCore ist privat: Cargo holt es über git mit dem Token aus dem Secret QUCORE_TOKEN
      # (Fine-grained Token, nur quCore, Contents: Read-only). Bei öffentlichem quCore bleibt das Secret leer.
      # Pakete, Bauen und Zusammenstellen: windows-bundle.sh (dasselbe wie install.ps1).
      - run: |
          if [ -n "$QUCORE_TOKEN" ]; then
            git config --global url."https://x-access-token:$QUCORE_TOKEN@github.com/simonroqu/quCore".insteadOf "https://github.com/simonroqu/quCore"
          fi
          sh windows-bundle.sh
          ls target/AniQu/bin
          (cd target && zip -qr ../AniQu-windows.zip AniQu)
        env:
          QUCORE_TOKEN: ${{ secrets.QUCORE_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      # Ordner statt ZIP: GitHub verpackt Artifacts beim Herunterladen selbst als ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: AniQu-windows
          path: target/AniQu

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AniQu-windows.zip
