# Bei jedem Tag (v…) unter Windows bauen und AniQu-windows.zip an den Release hängen.
# Gebaut wird in MSYS2 (UCRT64), dort gibt es GTK4 und libmpv fertig; die nötigen DLLs und Daten kommen mit ins ZIP.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # zum Ausprobieren von Hand starten (Actions → Windows → Run workflow), ohne Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-webp-pixbuf-loader
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      - run: cargo build --release

      # Aufbau wie unter MSYS2 (bin/, lib/, share/), dann findet GTK seine Daten relativ zur DLL.
      - name: Bundle
        run: |
          set -e
          out=AniQu
          mkdir -p $out/bin $out/lib $out/share/glib-2.0/schemas $out/share/icons
          cp target/release/aniqu.exe $out/bin/
          cp -r /ucrt64/lib/gdk-pixbuf-2.0 $out/lib/
          rm -f $out/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.a
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled $out/share/glib-2.0/schemas/
          cp -r /ucrt64/share/icons/Adwaita /ucrt64/share/icons/hicolor $out/share/icons/
          # Bildformat-Lader: Pfade relativ machen (gdk-pixbuf setzt sie unter Windows vor den Programmordner).
          cache=$out/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
          gdk-pixbuf-query-loaders | sed -E 's#^"[^"]*(lib[\\/]+gdk-pixbuf-2\.0)#"\1#' > $cache
          grep -c '^"lib' $cache
          # Alle DLLs aus MSYS2, die das Programm und die Lader brauchen (Windows-eigene bleiben draußen).
          for f in $out/bin/aniqu.exe $out/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll; do
            ldd "$f" | grep -o '/ucrt64/bin/[^ ]*\.dll' || true
          done | sort -u | xargs -I{} cp {} $out/bin/
          ls $out/bin
          zip -qr AniQu-windows.zip $out

      - uses: actions/upload-artifact@v4
        with:
          name: AniQu-windows
          path: AniQu-windows.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AniQu-windows.zip
